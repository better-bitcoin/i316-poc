# project.yml — XcodeGen 工程定义 (CI 里 brew install xcodegen && xcodegen 生成 .xcodeproj)
name: PoC
options:
  bundleIdPrefix: com.poc
  deploymentTarget:
    iOS: "16.0"
targets:
  PoC:
    type: application
    platform: iOS
    bundleId: com.poc.i316   # 显式设置 — 与 workflow 的 simctl launch 目标一致
    sources:
      - PoC
    info:
      path: PoC/Info.plist
      properties:
        CFBundleDisplayName: PoC
        UILaunchScreen: {}
        # ↓↓↓ 租户集成参数 — 在 GitHub Secrets 或本地填入真实值 ↓↓↓
        ZDK_APP_ID: REPLACE_WITH_APP_ID
        ZDK_INTEGRATION_ID: REPLACE_WITH_INTEGRATION_ID
        ZDK_BASE_URL: REPLACE_WITH_BASE_URL
        ZDK_SETTINGS_BASE_URL: REPLACE_WITH_SETTINGS_BASE_URL
