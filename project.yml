# project.yml — XcodeGen 工程定义 (CI 里 brew install xcodegen && xcodegen 生成 .xcodeproj)
name: PoC
options:
  bundleIdPrefix: com.poc
  deploymentTarget:
    iOS: "16.0"
targets:
  PoC:
    type: application
    platform: iOS
    bundleId: com.poc.i316   # 显式设置 — 与 workflow 的 simctl launch 目标一致
    sources:
      - PoC
    info:
      path: PoC/Info.plist
      properties:
        CFBundleDisplayName: PoC
        CFBundleIdentifier: com.poc.i316
        UILaunchScreen: {}
        # ↓↓↓ 集成参数 — 格式必须合法(否则 SDK URL 强解包崩溃); appId 从租户 SunCo JWT 解出
        ZDK_APP_ID: "27026516"
        ZDK_INTEGRATION_ID: "00000000-0000-4000-8000-000000000000"
        ZDK_BASE_URL: "https://api.smooch.io"
        ZDK_SETTINGS_BASE_URL: "https://api.smooch.io"
